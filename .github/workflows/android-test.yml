name: Android APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.3.4'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # The ubuntu runner ships a licensed Android SDK; setup-android@v3 fails installing the removed 'tools' package.
      - name: Use preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check security and clipboard behavior
        run: pnpm test && pnpm exec tsc --noEmit
      - name: Export and sync bundled app
        run: pnpm android:sync
      - name: Check offline assets
        run: node --test tests/offline.test.mjs
      # assembleRelease is unsigned here; it proves the shrunk/obfuscated build compiles with the ProGuard rules.
      - name: Build debug and release APKs and run Android unit tests
        working-directory: android
        run: sh ./gradlew assembleDebug assembleRelease testDebugUnitTest --no-daemon
      - name: Verify packaged launcher icons
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          test -n "$AAPT2"
          node scripts/verify-apk-icons.mjs android/app/build/outputs/apk/debug/app-debug.apk "$AAPT2" || {
            echo "::group::aapt2 badging (for diagnosing format changes)"
            "$AAPT2" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -E "^(package|application-label|launchable-activity)" || true
            echo "::endgroup::"
            exit 1
          }
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vault-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/vault-*-debug.apk
          if-no-files-found: error
          retention-days: 7
